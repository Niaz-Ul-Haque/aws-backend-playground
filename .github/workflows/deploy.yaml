name: Deploy to AWS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ca-central-1
  STACK_NAME: llm-playground

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Clean SAM build
        run: rm -rf .aws-sam

      - name: Install dependencies
        working-directory: src
        run: npm ci || npm install

      - name: Build TypeScript Lambda
        working-directory: src
        run: npm run build

      - name: Build SAM application
        run: sam build

      - name: Deploy SAM application
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --resolve-s3 \
            --force-upload \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              LlmApiKey='${{ secrets.LLM_API_KEY }}' \
              LlmApiUrl='https://api.z.ai/api/paas/v4/chat/completions' \
              LlmTimeoutMs='60000'

      - name: Get stack outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)

          FUNCTION_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ChatStreamEndpoint`].OutputValue' \
            --output text)

          TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`TableName`].OutputValue' \
            --output text)

          LLM_API_KEY_PARAM=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`LlmApiKeyParamName`].OutputValue' \
            --output text)

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "function_url=$FUNCTION_URL" >> $GITHUB_OUTPUT
          echo "table_name=$TABLE_NAME" >> $GITHUB_OUTPUT
          echo "llm_api_key_param=$LLM_API_KEY_PARAM" >> $GITHUB_OUTPUT

      - name: Update LLM API Key
        run: |
          aws ssm put-parameter \
            --name ${{ steps.stack-outputs.outputs.llm_api_key_param }} \
            --value "${{ secrets.LLM_API_KEY }}" \
            --type SecureString \
            --overwrite
      - name: Install seed script dependencies
        working-directory: scripts
        run: npm ci || npm install

      - name: Build TypeScript seed script
        working-directory: scripts
        run: npm run build

      - name: Seed DynamoDB table
        run: node scripts/seed.js ${{ steps.stack-outputs.outputs.table_name }}

      - name: Print deployment info
        run: |
          echo "Deployment successful!"
          echo ""
          echo "--- Stack Outputs ---"
          echo "API Gateway URL: ${{ steps.stack-outputs.outputs.api_url }}"
          echo "Chat Stream URL: ${{ steps.stack-outputs.outputs.function_url }}"
          echo "Table Name:      ${{ steps.stack-outputs.outputs.table_name }}"
          echo ""
          echo "--- Frontend Configuration ---"
          echo "NEXT_PUBLIC_API_BASE_URL=${{ steps.stack-outputs.outputs.api_url }}"
          echo "NEXT_PUBLIC_CHAT_STREAM_URL=${{ steps.stack-outputs.outputs.function_url }}"
