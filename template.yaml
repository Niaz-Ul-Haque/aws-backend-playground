AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ciri AI Backend - Financial Advisor Assistant API

Parameters:
  LlmApiKey:
    Type: String
    NoEcho: true
    Default: REPLACE_ME
    Description: LLM API key for Z.ai
  LlmApiUrl:
    Type: String
    Default: https://api.z.ai/api/paas/v4/chat/completions
    Description: LLM API base URL
  LlmModel:
    Type: String
    Default: glm-4.7-flashx
    Description: LLM model name
  LlmTimeoutMs:
    Type: String
    Default: '45000'
    Description: LLM request timeout in milliseconds

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref DataTable
        LLM_API_KEY: !Ref LlmApiKey
        LLM_API_URL: !Ref LlmApiUrl
        LLM_MODEL: !Ref LlmModel
        LLM_TIMEOUT_MS: !Ref LlmTimeoutMs

Resources:
  CiriApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref AWS::StackName
      Description: Ciri AI Backend API with streaming support
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Amz-Date
          - Authorization
          - X-Api-Key
          - X-Amz-Security-Token
          - Accept
          - Cache-Control
        AllowOrigins:
          - '*'
        MaxAge: 300

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-chat'
      CodeUri: src/
      Handler: dist/handlers/chat.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}-llmApiKey'
      Events:
        ChatPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/chat
            Method: POST

  ChatStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-chat-stream'
      CodeUri: src/
      Handler: dist/handlers/chat-stream.handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}-llmApiKey'

  ChatStreamFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM
      TargetFunctionArn: !GetAtt ChatStreamFunction.Arn
      Cors:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
          - accept
          - cache-control
          - accept-encoding
          - accept-language
          - origin
          - user-agent
          - sec-fetch-dest
          - sec-fetch-mode
          - sec-fetch-site
          - sec-ch-ua
          - sec-ch-ua-mobile
          - sec-ch-ua-platform
        AllowMethods:
          - POST
        MaxAge: 300

  ChatStreamFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt ChatStreamFunction.Arn
      Principal: '*'
      FunctionUrlAuthType: NONE
    DependsOn:
      - ChatStreamFunctionUrl

  ClientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-clients'
      CodeUri: src/
      Handler: dist/handlers/clients.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        ClientsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/clients
            Method: GET
        ClientsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/clients/{id}
            Method: GET

  PoliciesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-policies'
      CodeUri: src/
      Handler: dist/handlers/policies.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        PoliciesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/policies
            Method: GET
        PoliciesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/policies/{id}
            Method: GET

  TasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-tasks'
      CodeUri: src/
      Handler: dist/handlers/tasks.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        TasksList:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/tasks
            Method: GET
        TasksGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/tasks/{id}
            Method: GET
        TasksUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/tasks/{id}
            Method: PATCH
        TasksApprove:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/tasks/{id}/approve
            Method: POST
        TasksReject:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/tasks/{id}/reject
            Method: POST
        TasksComplete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/tasks/{id}/complete
            Method: POST
        TasksApproveWithEdits:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/tasks/{id}/approve-with-edits
            Method: POST

  ActionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-actions'
      CodeUri: src/
      Handler: dist/handlers/actions.handler
      Timeout: 30
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
      Events:
        ActionsSendEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/actions/send-email
            Method: POST
        ActionsResolveCompliance:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/actions/resolve-compliance
            Method: POST
        ActionsGenerateReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/actions/generate-report
            Method: POST
        ActionsExecute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/actions/execute
            Method: POST
        ActionsBulkTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/actions/bulk-tasks
            Method: POST
        ActionsBulkRenewal:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/actions/bulk-renewal
            Method: POST

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-health'
      CodeUri: src/
      Handler: dist/handlers/health.handler
      MemorySize: 128
      Timeout: 10
      Events:
        HealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref CiriApi
            Path: /api/health
            Method: GET

  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-data'
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  LlmApiKeyParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${AWS::StackName}-llmApiKey'
      Type: String
      Value: !Ref LlmApiKey
      Description: LLM API Key for Z.ai

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub 'https://${CiriApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}'

  ChatEndpoint:
    Description: Chat API Endpoint (non-streaming)
    Value: !Sub 'https://${CiriApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}/api/chat'

  ChatStreamEndpoint:
    Description: Chat Streaming Endpoint (SSE with status updates)
    Value: !GetAtt ChatStreamFunctionUrl.FunctionUrl

  ClientsEndpoint:
    Description: Clients API Endpoint
    Value: !Sub 'https://${CiriApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}/api/clients'

  PoliciesEndpoint:
    Description: Policies API Endpoint
    Value: !Sub 'https://${CiriApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}/api/policies'

  TasksEndpoint:
    Description: Tasks API Endpoint
    Value: !Sub 'https://${CiriApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}/api/tasks'

  ActionsEndpoint:
    Description: Actions API Endpoint
    Value: !Sub 'https://${CiriApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}/api/actions'

  HealthEndpoint:
    Description: Health Check Endpoint
    Value: !Sub 'https://${CiriApi}.execute-api.${AWS::Region}.amazonaws.com/${AWS::StackName}/api/health'

  TableName:
    Description: DynamoDB Table Name
    Value: !Ref DataTable

  LlmApiKeyParamName:
    Description: SSM Parameter Name for LLM API Key
    Value: !Ref LlmApiKeyParam